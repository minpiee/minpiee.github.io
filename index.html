<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="뽀모도로" />
    <meta name="theme-color" content="#222222" />
    <title>뽀모도로</title>
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- Pretendard를 스타일 파일보다 먼저 받기 시작해서, 글씨가 비어 보이는 시간을 줄인다 -->
    <link
      rel="preload"
      href="./fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <!--
      로그인 기록이 있는지 화면이 그려지기 전에 먼저 확인한다. (메인 화면이 잠깐 먼저 보이는 현상 방지)
      - 기록이 있으면(로그인한 채 새로고침): html에 hasSession을 붙여 로그인 창을 처음부터 숨긴다.
      - 기록이 없으면: 로그인 창이 처음부터 보인다. (style.css의 #authGate 기본값이 "보임")
      이 확인은 화면을 미리 정하기 위한 참고용이다. 진짜 로그인 확인은 script.js의 Supabase가 하고,
      결과가 다르면 그때 화면을 바로잡는다.
    -->
    <script>
      try {
        for (var i = 0; i < sessionStorage.length; i++) {
          var k = sessionStorage.key(i);
          if (/^sb-.+-auth-token$/.test(k) && sessionStorage.getItem(k)) {
            document.documentElement.className += " hasSession";
            break;
          }
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <!--
      아이콘 (SVG 스프라이트)
      Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com
      License - https://fontawesome.com/license/free (Icons: CC BY 4.0) Copyright 2026 Fonticons, Inc.
      아래 symbol들을 본문에서 use 태그(href="#i-이름")로 불러 쓴다. 색은 글자색(currentColor)을 따른다.
    -->
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <symbol id="i-play" viewBox="0 0 640 640">
        <path
          d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z"
        />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 640 640">

          d="M176 96C149.5 96 128 117.5 128 144L128 496C128 522.5 149.5 544 176 544L240 544C266.5 544 288 522.5 288 496L288 144C288 117.5 266.5 96 240 96L176 96zM400 96C373.5 96 352 117.5 352 144L352 496C352 522.5 373.5 544 400 544L464 544C490.5 544 512 522.5 512 496L512 144C512 117.5 490.5 96 464 96L400 96z"
        />
      </symbol>
      <symbol id="i-right-long" viewBox="0 0 640 640">
        <path
          d="M598.6 297.4C611.1 309.9 611.1 330.2 598.6 342.7L470.6 470.7C461.4 479.9 447.7 482.6 435.7 477.6C423.7 472.6 416 460.9 416 448L416 384L80 384C53.5 384 32 362.5 32 336L32 304C32 277.5 53.5 256 80 256L416 256L416 192C416 179.1 423.8 167.4 435.8 162.4C447.8 157.4 461.5 160.2 470.7 169.3L598.7 297.3z"
        />
      </symbol>
      <symbol id="i-left-long" viewBox="0 0 640 640">
        <path
          d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
        />
      </symbol>
      <symbol id="i-square" viewBox="0 0 640 640">
        <path
          d="M160 96L480 96C515.3 96 544 124.7 544 160L544 480C544 515.3 515.3 544 480 544L160 544C124.7 544 96 515.3 96 480L96 160C96 124.7 124.7 96 160 96z"
        />
      </symbol>
      <symbol id="i-chart-simple" viewBox="0 0 640 640">
        <path
          d="M256 144C256 117.5 277.5 96 304 96L336 96C362.5 96 384 117.5 384 144L384 496C384 522.5 362.5 544 336 544L304 544C277.5 544 256 522.5 256 496L256 144zM64 336C64 309.5 85.5 288 112 288L144 288C170.5 288 192 309.5 192 336L192 496C192 522.5 170.5 544 144 544L112 544C85.5 544 64 522.5 64 496L64 336zM496 160L528 160C554.5 160 576 181.5 576 208L576 496C576 522.5 554.5 544 528 544L496 544C469.5 544 448 522.5 448 496L448 208C448 181.5 469.5 160 496 160z"
        />
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 640 640">
        <path
          d="M169.4 297.4C156.9 309.9 156.9 330.2 169.4 342.7L361.4 534.7C373.9 547.2 394.2 547.2 406.7 534.7C419.2 522.2 419.2 501.9 406.7 489.4L237.3 320L406.6 150.6C419.1 138.1 419.1 117.8 406.6 105.3C394.1 92.8 373.8 92.8 361.3 105.3L169.3 297.3z"
        />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 640 640">
        <path
          d="M471.1 297.4C483.6 309.9 483.6 330.2 471.1 342.7L279.1 534.7C266.6 547.2 246.3 547.2 233.8 534.7C221.3 522.2 221.3 501.9 233.8 489.4L403.2 320L233.9 150.6C221.4 138.1 221.4 117.8 233.9 105.3C246.4 92.8 266.7 92.8 279.2 105.3L471.2 297.3z"
        />
      </symbol>
      <symbol id="i-cloud-arrow-up" viewBox="0 0 640 640">
        <path
          d="M176 544C96.5 544 32 479.5 32 400C32 336.6 73 282.8 129.9 263.5C128.6 255.8 128 248 128 240C128 160.5 192.5 96 272 96C327.4 96 375.5 127.3 399.6 173.1C413.8 164.8 430.4 160 448 160C501 160 544 203 544 256C544 271.7 540.2 286.6 533.5 299.7C577.5 320 608 364.4 608 416C608 486.7 550.7 544 480 544L176 544zM337 255C327.6 245.6 312.4 245.6 303.1 255L231.1 327C221.7 336.4 221.7 351.6 231.1 360.9C240.5 370.2 255.7 370.3 265 360.9L296 329.9L296 432C296 445.3 306.7 456 320 456C333.3 456 344 445.3 344 432L344 329.9L375 360.9C384.4 370.3 399.6 370.3 408.9 360.9C418.2 351.5 418.3 336.3 408.9 327L336.9 255z"
        />
      </symbol>
      <symbol id="i-arrow-up" viewBox="0 0 640 640">
        <path
          d="M342.6 73.4C330.1 60.9 309.8 60.9 297.3 73.4L137.3 233.4C124.8 245.9 124.8 266.2 137.3 278.7C149.8 291.2 170.1 291.2 182.6 278.7L288 173.3L288 544C288 561.7 302.3 576 320 576C337.7 576 352 561.7 352 544L352 173.3L457.4 278.7C469.9 291.2 490.2 291.2 502.7 278.7C515.2 266.2 515.2 245.9 502.7 233.4L342.7 73.4z"
        />
      </symbol>
      <symbol id="i-arrow-down" viewBox="0 0 640 640">
        <path
          d="M297.4 566.6C309.9 579.1 330.2 579.1 342.7 566.6L502.7 406.6C515.2 394.1 515.2 373.8 502.7 361.3C490.2 348.8 469.9 348.8 457.4 361.3L352 466.7L352 96C352 78.3 337.7 64 320 64C302.3 64 288 78.3 288 96L288 466.7L182.6 361.3C170.1 348.8 149.8 348.8 137.3 361.3C124.8 373.8 124.8 394.1 137.3 406.6L297.3 566.6z"
        />
      </symbol>
    </svg>

    <img id="bg" alt="" />
    <div id="shade"></div>
    <div id="toast" role="status"></div>

    <!-- 분석 화면 -->
    <div
      id="analysisView"
      class="calModal"
      role="dialog"
      aria-modal="true"
      aria-label="집중 분석"
      hidden
    >
      <div class="calCard">
        <button id="backToTimer" class="analysisBack" type="button">
          <i class="icon" aria-hidden="true"
            ><svg focusable="false"><use href="#i-left-long" /></svg
          ></i>
          타이머
        </button>
        <div class="seg" role="tablist" aria-label="분석 기간">
          <button
            id="tabWeek"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="weekPane"
          >
            주간
          </button>
          <button
            id="tabMonth"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="monthPane"
          >
            월간
          </button>
          <button
            id="tabYear"
            type="button"
            role="tab"
            class="active"
            aria-selected="true"
            aria-controls="yearPane"
          >
            연간
          </button>
        </div>

        <!-- 주간 (막대 그래프) -->
        <div id="weekPane" role="tabpanel" aria-labelledby="tabWeek" hidden>
          <div class="calHead">
            <strong id="weekTitle"></strong>
            <div class="calNav">
              <button id="weekPrev" type="button" aria-label="이전 주">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-left" /></svg
                ></i>
              </button>
              <button id="weekNext" type="button" aria-label="다음 주">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-right" /></svg
                ></i>
              </button>
            </div>
          </div>
          <div id="weekSummary" class="statHero"></div>
          <div id="weekBars" class="weekBars"></div>
        </div>
        <!-- 월간 (달력) -->
        <div id="monthPane" role="tabpanel" aria-labelledby="tabMonth" hidden>
          <div class="calHead">
            <strong id="calTitle"></strong>
            <div class="calNav">
              <button id="calPrev" type="button" aria-label="이전 달">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-left" /></svg
                ></i>
              </button>
              <button id="calNext" type="button" aria-label="다음 달">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-right" /></svg
                ></i>
              </button>
            </div>
          </div>
          <div id="calSummary" class="statHero"></div>
          <div id="calGrid" class="calGrid"></div>
        </div>

        <!-- 연간 (잔디) -->
        <div id="yearPane" role="tabpanel" aria-labelledby="tabYear">
          <div class="yearHead">
            <strong id="yearTitle"></strong>
            <div class="yearNav">
              <button id="yearPrev" type="button" aria-label="이전 해">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-left" /></svg
                ></i>
              </button>
              <button id="yearNext" type="button" aria-label="다음 해">
                <i class="icon" aria-hidden="true"
                  ><svg focusable="false"><use href="#i-chevron-right" /></svg
                ></i>
              </button>
            </div>
          </div>
          <div id="yearSummary" class="statHero"></div>

          <div class="heatWrap">
            <div
              id="heatScroll"
              class="heatScroll"
              tabindex="0"
              aria-label="연간 집중 기록 (좌우로 스크롤)"
            >
              <div class="heatInner">
                <div id="heatMonths" class="heatMonths"></div>
                <div id="heatGrid" class="heatGrid"></div>
              </div>
            </div>
            <div id="heatBar" class="heatBar"></div>
          </div>
          <div class="heatLegend" aria-hidden="true">
            <span>적음</span>
            <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i
            ><i class="l4"></i>
            <span>많음</span>
          </div>
        </div>
      </div>
    </div>

    <!--
      로그인 창: 처음부터 보이는 게 기본이다. (style.css의 #authGate)
      로그인 기록이 있으면 html.hasSession 규칙으로 숨겨지고, 로그인 상태가 확인되면 script.js가 보이기/숨기기를 정한다.
    -->
    <div
      id="authGate"
      role="dialog"
      aria-modal="true"
      aria-labelledby="authTitle"
    >
      <form id="authForm">
        <div class="authIntro">
          <!-- 로그인 창의 이름(aria-labelledby="authTitle")으로 쓰이는 제목 -->
          <h2 id="authTitle" class="authHeadline">로그인</h2>
          <div class="authSub">오늘의 기록을 시작하세요.</div>
        </div>

        <input
          id="authEmail"
          type="email"
          autocomplete="username"
          aria-label="이메일"
          placeholder="이메일"
          required
        />

        <input
          id="authPassword"
          type="password"
          autocomplete="current-password"
          aria-label="비밀번호"
          placeholder="비밀번호"
          required
        />

        <button id="authSubmit" type="submit">로그인하기</button>

        <p id="authMessage" role="status"></p>

        <p class="authFoot">
          <span>PERSONAL WORKSPACE</span>
          <span>Only for me.</span>
        </p>
      </form>
    </div>

    <div id="syncStatus" class="syncStatus" role="status" hidden>
      <i class="icon" aria-hidden="true"
        ><svg focusable="false"><use href="#i-cloud-arrow-up" /></svg
      ></i>
      <span id="syncStatusText"></span>
    </div>

    <!-- 집중 횟수 "0 / 4": 왼쪽 위 (오른쪽 위의 분석·로그아웃 버튼 반대편). 누를 때마다 0 → 1 → 2 → 3 → 0 으로 바뀐다. -->
    <button
      id="cycleCount"
      class="cycleCount"
      type="button"
      aria-label="집중 0/4 완료. 누르면 횟수가 바뀌어요"
    >
      0 / 4
    </button>

    <div id="authActions" class="authActions" hidden>
      <button id="openAnalysis" type="button">
        <i class="icon" aria-hidden="true"
          ><svg focusable="false"><use href="#i-chart-simple" /></svg
        ></i>
        분석
      </button>
      <button id="authLogout" type="button">로그아웃</button>
    </div>
    <div class="wrap" inert>
      <div class="timerBox">
        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="92"></circle>

            <circle
              class="progress"
              id="progress"
              cx="100"
              cy="100"
              r="92"
            ></circle>
          </svg>

          <div class="timerContent" id="timerContent">
            <div
              class="time"
              id="time"
              role="button"
              tabindex="0"
              aria-label="타이머 시간 설정"
            >
              30:00
            </div>

            <div class="totalFocus" id="totalFocus" aria-label="누적 집중 시간">
              --
            </div>

            <div class="settingsContent" id="settingsContent" inert>
              <div class="settingsRows">
                <!-- 집중 -->
                <div class="settingsRow">
                  <span class="settingLabel">집중</span>

                  <div class="settingValue">
                    <input
                      id="focusInput"
                      type="number"
                      min="1"
                      max="180"
                      step="1"
                      value="30"
                      aria-label="집중 시간(분)"
                    />
                    <span>분</span>
                  </div>
                </div>

                <!-- 짧은 휴식 -->
                <div class="settingsRow">
                  <span class="settingLabel">짧은 휴식</span>

                  <div class="settingValue">
                    <input
                      id="breakInput"
                      type="number"
                      min="1"
                      max="60"
                      step="1"
                      value="5"
                      aria-label="짧은 휴식 시간(분)"
                    />
                    <span>분</span>
                  </div>
                </div>

                <!-- 긴 휴식 (0이면 사용 안 함) -->
                <div class="settingsRow">
                  <span class="settingLabel">긴 휴식</span>

                  <div class="settingValue">
                    <input
                      id="longBreakInput"
                      type="number"
                      min="0"
                      max="60"
                      step="1"
                      value="15"
                      aria-label="긴 휴식 시간(분), 0이면 사용 안 함"
                    />
                    <span>분</span>
                  </div>
                </div>
              </div>

              <div class="settingsActions">
                <button id="cancelSettings" class="pillBtn" type="button">
                  취소
                </button>
                <button id="saveSettings" class="pillBtn" type="button">
                  저장
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="start" type="button">
            <i class="icon" aria-hidden="true"
              ><svg focusable="false"><use href="#i-play" /></svg
            ></i>
            시작
          </button>
          <button id="pause" type="button">
            <i class="icon" aria-hidden="true"
              ><svg focusable="false"><use href="#i-pause" /></svg
            ></i>
            정지
          </button>
          <button id="skip" type="button">
            다음
            <i class="icon" aria-hidden="true"
              ><svg focusable="false"><use href="#i-right-long" /></svg
            ></i>
          </button>
          <button id="finish" type="button">
            <i class="icon" aria-hidden="true"
              ><svg focusable="false"><use href="#i-square" /></svg
            ></i>
            종료
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"
      integrity="sha384-RJpiDscpUIa2tmNUABXIB4EgEoaAMRcl5+yJJxYC+kXKvCFctiqLTn9j1AwOc9n1"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
