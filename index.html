<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pomodoro</title>
    <link rel="apple-touch-icon" href="icon.png" />

    <style>
      @font-face {
        font-family: "OngleipParkDahyeon";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2")
          format("woff2");
        font-weight: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "OngleipParkDahyeon", Arial, sans-serif;
      }

      body {
        position: relative;
        background: #222;
        color: white;
        isolation: isolate;
      }

      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
        object-fit: cover;
        object-position: center center;
        z-index: 0;
        opacity: 1;
        transition: opacity 0.6s ease;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      #shade {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.16);
        z-index: 1;
        pointer-events: none;
      }

      .wrap {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px max(24px, env(safe-area-inset-right)) 24px
          max(24px, env(safe-area-inset-left));
      }

      .timerBox {
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 900px;
      }

      .ring {
        width: min(52vh, 430px);
        height: min(52vh, 430px);
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.32);
        stroke-width: 5;
      }

      .progress {
        fill: none;
        stroke: white;
        stroke-width: 5;
        stroke-linecap: round;
        transition: stroke-dasharray 0.25s linear;
      }

      .timerContent {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .time {
        font-size: clamp(34px, min(9vw, 10vh), 104px);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
        white-space: nowrap;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .time:hover {
        opacity: 0.88;
      }

      .time:active {
        transform: scale(0.98);
      }

      .totalFocus {
        margin-top: 8px;
        font-size: clamp(16px, 3vw, 25px);
        font-weight: 400;
        letter-spacing: 1px;
        opacity: 0.82;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        white-space: nowrap;
      }

      /* =========================
             링 안 설정 화면
         ========================= */

      .settingsContent {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          visibility 0.18s ease;
      }

      .settingsContent.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .timerContent.is-settings .time,
      .timerContent.is-settings .totalFocus {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /*
        설정 화면 구조
        집중       휴식
        30분       5분
        취소       저장
    */

      .settingsRows {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: clamp(30px, 8vw, 60px);
      }

      .settingsRow {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-width: 82px;
      }

      .settingLabel {
        margin-bottom: 7px;
        font-size: 15px;
        font-weight: 400;
        line-height: 1;
        color: rgba(255, 255, 255, 0.76);
        white-space: nowrap;
      }

      .settingValue {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 3px;
        min-height: 52px;
      }

      .settingValue input {
        width: 62px;
        height: 52px;
        margin: 0;
        padding: 0;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.38);
        outline: 0;
        background: transparent;
        color: #fff;
        font-family: "OngleipParkDahyeon", Arial, sans-serif;
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 700;
        line-height: 1;
        text-align: center;
        transition:
          border-color 0.15s ease,
          opacity 0.15s ease;
      }

      .settingValue input:focus {
        border-bottom-color: rgba(255, 255, 255, 0.85);
      }

      .settingValue input::-webkit-inner-spin-button,
      .settingValue input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .settingValue input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .settingValue span {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
      }

      /* 설정 버튼 */

      .settingsRow .settingsApply {
        margin-top: 14px;
      }

      .settingsApply {
        min-width: 68px;
        min-height: 38px;
        padding: 7px 15px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 999px;
        background: rgba(0 0 0 / 10%);
        color: rgba(255, 255, 255, 0.92);
        font-family: "OngleipParkDahyeon", Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }

      .settingsApply:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.58);
      }

      .settingsApply:active {
        background: rgba(255, 255, 255, 0.24);
        transform: scale(0.97);
      }

      /* =========================
               기존 컨트롤
         ========================= */

      .controls {
        width: fit-content;
        max-width: 100%;
        margin-top: 24px;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 9px;
        justify-content: center;
        align-items: center;
      }

      .resetTotal {
        margin-top: 12px;
        padding: 6px 14px;
        font-size: 14px;
        opacity: 0.7;
      }

      .resetTotal:hover {
        opacity: 1;
      }

      button {
        font-family: "OngleipParkDahyeon", Arial, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.55);
        background: rgba(0 0 0 / 10%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: white;
        border-radius: 999px;
        padding: 10px 17px;
        font-size: 18px;
        cursor: pointer;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          background 0.15s,
          transform 0.1s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      button:active {
        background: rgba(255, 255, 255, 0.36);
        transform: scale(0.97);
      }

      /* =========================
                 알림
         ========================= */

      #toast {
        position: fixed;
        left: 50%;
        bottom: max(70px, calc(56px + env(safe-area-inset-bottom)));
        transform: translateX(-50%) translateY(18px);
        opacity: 0;
        transition:
          opacity 0.35s,
          transform 0.35s;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 13px;
        pointer-events: none;
        white-space: nowrap;
        z-index: 40;
        max-width: calc(100vw - 48px);
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* =========================
           종료 팝업 (작게)
         ========================= */

      .finishOverlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.3);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          visibility 0.18s ease;
      }

      .finishOverlay.open {
        opacity: 1;
        visibility: visible;
      }

      .finishCard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 20px 28px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-align: center;
        max-width: 100%;
      }

      .finishText {
        font-size: clamp(18px, 4.5vw, 24px);
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      /* =========================
             좁은 세로 화면
         ========================= */

      @media (orientation: portrait) and (max-width: 1100px) {
        .wrap {
          padding: 24px max(16px, env(safe-area-inset-right)) 24px
            max(16px, env(safe-area-inset-left));
        }

        .ring {
          width: min(66vw, 390px);
          height: min(66vw, 390px);
        }

        .controls {
          gap: 12px;
        }

        .controls button {
          flex: 0 0 auto;
          min-width: 0;
          padding: 10px 17px;
          font-size: 16px;
        }
      }

      @media (orientation: portrait) and (max-width: 395px) {
        .timerBox {
          transform: translateY(-10px);
        }

        .ring {
          width: min(72vw, 280px);
          height: min(72vw, 280px);
        }

        .time {
          font-size: 64px;
        }

        .totalFocus {
          font-size: 18px;
        }

        .controls {
          gap: 4px;
        }

        .controls button {
          font-size: 11px;
          padding: 10px 11px;
        }

        .settingsRows {
          gap: 20px;
        }

        .settingsRow {
          min-width: 76px;
        }

        .settingValue input {
          width: 54px;
          font-size: 29px;
        }

        .settingLabel {
          font-size: 14px;
        }

        .settingsRow .settingsApply {
          margin-top: 11px;
        }

        .settingsApply {
          min-width: 60px;
          min-height: 36px;
          padding: 6px 12px;
          font-size: 14px;
        }
      }

      @media (orientation: portrait) and (min-width: 601px) and (max-width: 1100px) {
        .ring {
          width: min(68vw, 520px);
          height: min(68vw, 520px);
        }

        .time {
          font-size: clamp(70px, 11vw, 120px);
        }

        .totalFocus {
          font-size: 32px;
        }

        .controls button {
          font-size: 24px;
        }
      }

      /* =========================
           좁은 화면 대응
       ========================= */

      @media (max-width: 900px) {
        .controls {
          gap: 8px;
        }

        .controls button {
          flex: 0 0 auto;
          min-width: 0;
          padding: 10px 17px;
          font-size: 18px;
        }
      }

      @media (max-width: 750px) {
        .controls {
          gap: 6px;
        }

        .controls button {
          padding: 8px 10px;
          font-size: 13px;
        }
      }

      @media (max-width: 620px) {
        .controls {
          gap: 5px;
        }

        .controls button {
          padding: 8px 9px;
          font-size: 13px;
        }
      }

      /* =========================
             높이가 낮은 화면
         ========================= */

      @media (orientation: landscape) and (max-height: 500px) {
        .ring {
          width: min(58vh, 280px);
          height: min(58vh, 280px);
        }

        .controls {
          margin-top: 12px;
        }

        .controls button {
          flex: 0 0 auto;
          min-width: 0;
          padding: 7px 11px;
          font-size: 14px;
        }

        .time {
          font-size: clamp(40px, min(9vw, 12vh), 82px);
          letter-spacing: 1px;
        }

        .totalFocus {
          margin-top: 7px;
          font-size: 18px;
        }

        .settingsRows {
          gap: 24px;
        }

        .settingLabel {
          font-size: 15px;
          margin-bottom: 5px;
        }

        .settingValue {
          min-height: 40px;
        }

        .settingValue input {
          height: 40px;
          font-size: 28px;
        }

        .settingValue span {
          font-size: 15px;
        }

        .settingsRow .settingsApply {
          margin-top: 10px;
        }

        .settingsApply {
          min-width: 64px;
          min-height: 38px;
          padding: 6px 13px;
          font-size: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <img id="bg" alt="" />
    <div id="shade"></div>
    <div id="toast"></div>

    <div class="finishOverlay" id="finishOverlay" aria-hidden="true">
      <div
        class="finishCard"
        role="dialog"
        aria-modal="true"
        aria-labelledby="finishText"
      >
        <div class="finishText" id="finishText"></div>
        <button id="finishOk" class="settingsApply" type="button">확인</button>
      </div>
    </div>

    <div class="wrap">
      <div class="timerBox">
        <div class="ring" id="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="92"></circle>

            <circle
              class="progress"
              id="progress"
              cx="100"
              cy="100"
              r="92"
            ></circle>
          </svg>

          <div class="timerContent" id="timerContent">
            <div
              class="time"
              id="time"
              role="button"
              tabindex="0"
              aria-label="타이머 시간 설정"
            >
              30:00
            </div>

            <div class="totalFocus" id="totalFocus" aria-label="누적 집중 시간">
              00:00
            </div>

            <div
              class="settingsContent"
              id="settingsContent"
              aria-hidden="true"
            >
              <div class="settingsRows">
                <!-- 집중 -->
                <div class="settingsRow">
                  <span class="settingLabel">집중</span>

                  <div class="settingValue">
                    <input
                      id="focusInput"
                      type="number"
                      min="1"
                      max="180"
                      step="1"
                      value="30"
                      aria-label="집중 시간(분)"
                    />
                    <span>분</span>
                  </div>

                  <button
                    id="cancelSettings"
                    class="settingsApply"
                    type="button"
                  >
                    취소
                  </button>
                </div>

                <!-- 휴식 -->
                <div class="settingsRow">
                  <span class="settingLabel">휴식</span>

                  <div class="settingValue">
                    <input
                      id="breakInput"
                      type="number"
                      min="1"
                      max="60"
                      step="1"
                      value="5"
                      aria-label="휴식 시간(분)"
                    />
                    <span>분</span>
                  </div>

                  <button id="saveSettings" class="settingsApply" type="button">
                    저장
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="start" type="button">▶ 시작</button>
          <button id="pause" type="button">Ⅱ 정지</button>
          <button id="skip" type="button">다음 →</button>
          <button id="finish" type="button">■ 종료</button>
        </div>
      </div>
    </div>

    <script>
      const FOCUS_BACKGROUNDS = [
        "backgrounds/bg1.jpg",
        "backgrounds/bg2.jpg",
        "backgrounds/bg3.jpg",
        "backgrounds/bg4.jpg",
        "backgrounds/bg5.jpg",
        "backgrounds/bg6.jpg",
        "backgrounds/bg7.jpg",
        "backgrounds/bg8.jpg",
        "backgrounds/bg9.jpg",
        "backgrounds/bg10.jpg",
        "backgrounds/bg11.jpg",
        "backgrounds/bg12.jpg",
        "backgrounds/bg13.jpg",
      ];

      const BREAK_BACKGROUNDS = ["backgrounds/break.jpg"];

      let currentFocusBg = -1;
      let currentBreakBg = -1;
      let backgroundChangeTimer = null;

      const bg = document.getElementById("bg");
      const timeEl = document.getElementById("time");
      const totalFocusEl = document.getElementById("totalFocus");
      const progress = document.getElementById("progress");
      const toast = document.getElementById("toast");
      const timerContent = document.getElementById("timerContent");
      const settingsContent = document.getElementById("settingsContent");
      const focusInput = document.getElementById("focusInput");
      const breakInput = document.getElementById("breakInput");
      const saveSettingsBtn = document.getElementById("saveSettings");
      const cancelSettingsBtn = document.getElementById("cancelSettings");
      const finishOverlay = document.getElementById("finishOverlay");
      const finishText = document.getElementById("finishText");
      const finishOkBtn = document.getElementById("finishOk");

      const R = 92;
      const C = 2 * Math.PI * R;

      progress.style.strokeDasharray = `0 ${C}`;
      progress.style.strokeDashoffset = 0;

      const SETTINGS_KEY = "cozyPomodoroSettings";
      const FOCUS_TOTAL_KEY = "cozyPomodoroFocusTotal";

      function getLocalDateKey(date = new Date()) {
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
      }

      function nextDateKey(key) {
        const [y, m, d] = String(key).split("-").map(Number);

        return getLocalDateKey(new Date(y, m - 1, d + 1));
      }

      /*
        저장 형식: { date, seconds, carry }

        date    : 화면 누적이 시작된 날짜
        seconds : 화면에 보이는 누적 집중 시간
        carry   : seconds 중 자정 이후(다음 날)에 쌓인 몫

        자정을 넘겨도 `종료`를 누르기 전까지는 seconds가 계속 이어진다.
        `종료`를 누르면 carry만 남기고 새 날짜로 넘어간다.
      */
      function loadFocusState() {
        const today = getLocalDateKey();

        try {
          const saved = JSON.parse(localStorage.getItem(FOCUS_TOTAL_KEY));

          if (
            saved &&
            typeof saved.date === "string" &&
            Number.isFinite(Number(saved.seconds))
          ) {
            const seconds = Math.max(0, Math.floor(Number(saved.seconds)));
            const carry = Number.isFinite(Number(saved.carry))
              ? Math.min(seconds, Math.max(0, Math.floor(Number(saved.carry))))
              : 0;

            if (saved.date === today) {
              return { date: today, seconds, carry };
            }

            // 종료를 안 누르고 닫았다가 날짜가 바뀐 뒤 연 경우:
            // 바로 다음 날이면 자정 이후 몫만 이어서, 아니면 0부터.
            return {
              date: today,
              seconds: nextDateKey(saved.date) === today ? carry : 0,
              carry: 0,
            };
          }
        } catch (e) {
          console.warn("오늘 누적 집중 시간 불러오기 실패:", e);
        }

        return { date: today, seconds: 0, carry: 0 };
      }

      /*
        elapsed 중에서 자정 이후에 지난 시간.
        누적이 시작된 날짜와 지금 날짜가 같으면 0.
      */
      function postMidnightPart(elapsed) {
        if (elapsed <= 0 || focusTotalDate === getLocalDateKey()) {
          return 0;
        }

        const midnight = new Date();
        midnight.setHours(0, 0, 0, 0);

        const sinceMidnight = Math.max(
          0,
          Math.floor((Date.now() - midnight.getTime()) / 1000),
        );

        return Math.min(elapsed, sinceMidnight);
      }

      function saveFocusTotal(includeCurrent = false) {
        const current = includeCurrent ? getCurrentFocusElapsed() : 0;
        const seconds = Math.max(0, totalFocusSeconds + current);
        const carry = Math.min(
          seconds,
          carrySeconds + postMidnightPart(current),
        );

        try {
          localStorage.setItem(
            FOCUS_TOTAL_KEY,
            JSON.stringify({
              date: focusTotalDate,
              seconds,
              carry,
            }),
          );
        } catch (e) {
          console.warn("오늘 누적 집중 시간 저장 실패:", e);
        }
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));

          if (
            saved &&
            Number.isFinite(Number(saved.focusMinutes)) &&
            Number(saved.focusMinutes) >= 1 &&
            Number(saved.focusMinutes) <= 180 &&
            Number.isFinite(Number(saved.breakMinutes)) &&
            Number(saved.breakMinutes) >= 1 &&
            Number(saved.breakMinutes) <= 60
          ) {
            return {
              focusMinutes: Number(saved.focusMinutes),
              breakMinutes: Number(saved.breakMinutes),
            };
          }
        } catch (e) {
          console.warn("설정 불러오기 실패:", e);
        }

        return {
          focusMinutes: 30,
          breakMinutes: 5,
        };
      }

      let settings = loadSettings();

      focusInput.value = settings.focusMinutes;
      breakInput.value = settings.breakMinutes;

      let settingsOpen = false;
      let settingsWasRunning = false;

      let phase = "focus";
      let duration = settings.focusMinutes * 60;
      let remaining = duration;

      let running = false;
      let endTime = null;

      let timerId = null;
      let titleRafId = null;
      let titleTimeoutId = null;
      let hiddenWorker = null;
      let hiddenWorkerUrl = null;

      /*
      누적 집중시간 계산의 핵심

      totalFocusSeconds:
        이미 확정해서 저장한 집중 시간

      focusSegmentStartRemaining:
        현재 집중 구간이 시작됐을 때의 remaining

      현재 집중 구간에서 실제로 경과한 시간:
        focusSegmentStartRemaining - remaining

      이렇게 하면 일시정지 / 재개 / 다음 단계에서
      같은 시간을 두 번 더하지 않는다.
    */
      const initialFocusState = loadFocusState();

      let totalFocusSeconds = initialFocusState.seconds;
      let focusTotalDate = initialFocusState.date;
      let carrySeconds = initialFocusState.carry;
      let focusSegmentStartRemaining = null;

      let finishPopupOpen = false;

      /*
        날짜 경계 적용 (`종료`를 누를 때만 실행)

        화면 누적에서 어제 몫을 빼고, 자정 이후에 쌓은 몫(carry)만 남긴다.
        자정을 안 넘겼으면 아무것도 하지 않는다.
      */
      function applyDayBoundary() {
        const today = getLocalDateKey();

        if (today === focusTotalDate) {
          return false;
        }

        totalFocusSeconds =
          nextDateKey(focusTotalDate) === today ? carrySeconds : 0;
        carrySeconds = 0;
        focusTotalDate = today;
        focusSegmentStartRemaining = null;

        saveFocusTotal();
        return true;
      }

      /*
        종료를 안 눌렀더라도, 날짜가 바뀌었고 자정 이후에 쌓인 집중이
        하나도 없으면(carry가 0) 새 날 00:00으로 자동으로 넘긴다.
        예) 23:00에 집중을 끝내고 탭을 켜 둔 채 다음 날이 된 경우.

        자정 이후 몫이 있으면 건드리지 않는다. (종료 때 팝업과 함께 정리)
        타이머가 돌아가는 중이거나 팝업이 떠 있을 때도 건드리지 않는다.
      */
      function rolloverIfIdle() {
        if (running || finishPopupOpen) return;
        if (focusTotalDate === getLocalDateKey()) return;
        if (carrySeconds > 0) return;

        applyDayBoundary();
        render();
      }

      function getCurrentFocusElapsed() {
        if (
          !running ||
          phase !== "focus" ||
          focusSegmentStartRemaining === null
        ) {
          return 0;
        }

        // 타이머 표시(ceil)와 같은 기준으로 계산 → 항상 정수
        return Math.max(
          0,
          Math.ceil(focusSegmentStartRemaining) - Math.ceil(remaining),
        );
      }

      function commitCurrentFocusTime() {
        if (phase !== "focus" || focusSegmentStartRemaining === null) {
          return;
        }

        const elapsed = Math.max(
          0,
          Math.ceil(focusSegmentStartRemaining) - Math.ceil(remaining),
        );

        if (elapsed > 0) {
          carrySeconds += postMidnightPart(elapsed);
          totalFocusSeconds += elapsed;
        }

        focusSegmentStartRemaining = null;
        saveFocusTotal();
      }

      function changeBackground(list, type) {
        if (list.length === 0) return;

        let next;

        if (type === "focus") {
          do {
            next = Math.floor(Math.random() * list.length);
          } while (list.length > 1 && next === currentFocusBg);

          currentFocusBg = next;
        } else {
          do {
            next = Math.floor(Math.random() * list.length);
          } while (list.length > 1 && next === currentBreakBg);

          currentBreakBg = next;
        }

        bg.style.opacity = "0";

        clearTimeout(backgroundChangeTimer);

        backgroundChangeTimer = setTimeout(() => {
          bg.onload = () => {
            bg.style.opacity = "1";
          };

          bg.onerror = () => {
            bg.style.opacity = "1";
            console.warn("배경 이미지 로딩 실패:", list[next]);
          };

          bg.src = list[next];
        }, 180);
      }

      function setBackgroundForPhase() {
        if (phase === "focus") {
          changeBackground(FOCUS_BACKGROUNDS, "focus");
        } else {
          changeBackground(BREAK_BACKGROUNDS, "break");
        }
      }

      setBackgroundForPhase();

      function format(sec) {
        sec = Math.max(0, Math.ceil(sec));

        return (
          String(Math.floor(sec / 60)).padStart(2, "0") +
          ":" +
          String(sec % 60).padStart(2, "0")
        );
      }

      function formatFocusTotal(sec) {
        /*
        메인 타이머는 ceil,
        누적 시간은 floor.

        그래서 시작 직후:
          타이머 01:00
          누적 00:00

        정확히 1초가 지나면:
          타이머 00:59
          누적 00:01

        시각적으로 초가 같이 넘어간다.
      */
        sec = Math.max(0, Math.floor(sec));

        const hours = Math.floor(sec / 3600);
        const minutes = Math.floor((sec % 3600) / 60);
        const seconds = sec % 60;

        if (hours > 0) {
          return (
            `${hours}:` +
            `${String(minutes).padStart(2, "0")}:` +
            `${String(seconds).padStart(2, "0")}`
          );
        }

        return (
          `${String(minutes).padStart(2, "0")}:` +
          `${String(seconds).padStart(2, "0")}`
        );
      }

      function formatHMS(sec) {
        sec = Math.max(0, Math.floor(sec));

        return [
          Math.floor(sec / 3600),
          Math.floor((sec % 3600) / 60),
          sec % 60,
        ]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function render() {
        timeEl.textContent = format(remaining);

        // 종료 팝업이 떠 있는 동안은 합계를 그대로 두고, 닫을 때 갱신한다.
        if (!finishPopupOpen) {
          const displayedFocusSeconds =
            totalFocusSeconds + getCurrentFocusElapsed();

          totalFocusEl.textContent = formatFocusTotal(displayedFocusSeconds);
        }

        const ratio = Math.max(
          0,
          Math.min(1, (duration - remaining) / duration),
        );

        progress.style.strokeDasharray = `${C * ratio} ${C}`;

        progress.style.strokeDashoffset = 0;

        document.title =
          `${format(remaining)} · ` + `${phase === "focus" ? "집중" : "휴식"}`;
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");

        clearTimeout(showToast.t);

        showToast.t = setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      }

      const sounds = {
        focusStart: new Audio("sounds/focus-start.wav"),
        focusEnd: new Audio("sounds/focus-end.wav"),
        breakStart: new Audio("sounds/break-start.wav"),
        breakEnd: new Audio("sounds/break-end.wav"),
        pause: new Audio("sounds/pause.wav"),
      };

      Object.values(sounds).forEach((audio) => {
        audio.preload = "auto";
        audio.volume = 1;
      });

      function beep(kind) {
        const audio = sounds[kind] || sounds.focusStart;

        try {
          audio.pause();
          audio.currentTime = 0;

          const playPromise = audio.play();

          if (playPromise instanceof Promise) {
            playPromise.catch((error) => {
              console.warn("알림음 재생 실패:", error);
            });
          }
        } catch (error) {
          console.warn("알림음 재생 실패:", error);
        }
      }

      /*
        마지막 5초 카운트다운 틱 소리
        - 파일 없이 WebAudio로 짧은 "똑" 소리를 만든다.
        - 5, 4, 3, 2, 1초 남았을 때 각각 한 번씩 울린다.
        - 집중/휴식 모두 적용된다.
      */
      const COUNTDOWN_SECONDS = 5;
      // 카운트다운 소리 크기 (1 = 기본, 숫자를 키울수록 커짐)
      const TICK_VOLUME = 3;
      let tickCtx = null;
      let tickMaster = null;
      let lastTickSecond = null;

      function unlockTickAudio() {
        try {
          if (!tickCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            tickCtx = new Ctx();

            // 마스터 볼륨 → 컴프레서(찢어짐 방지) → 스피커
            const compressor = tickCtx.createDynamicsCompressor();
            compressor.threshold.value = -10;
            compressor.knee.value = 0;
            compressor.ratio.value = 20;
            compressor.attack.value = 0.001;
            compressor.release.value = 0.06;

            tickMaster = tickCtx.createGain();
            tickMaster.gain.value = TICK_VOLUME;

            tickMaster.connect(compressor);
            compressor.connect(tickCtx.destination);
          }
          if (tickCtx.state !== "running") {
            const p = tickCtx.resume();
            if (p && p.catch) p.catch(() => {});
          }
        } catch (error) {
          console.warn("틱 소리 준비 실패:", error);
        }
      }

      function playTick() {
        if (!tickCtx || tickCtx.state !== "running") {
          // 브라우저가 컨텍스트를 멈춰 둔 경우 다시 깨워 둔다.
          unlockTickAudio();
          return;
        }

        const t = tickCtx.currentTime;

        // 낮고 둥근 "동" 소리: 음높이 변화 없이 부드럽게 울렸다 사라짐
        const gain = tickCtx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(1, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        gain.connect(tickMaster);

        [
          [587, 1], // 기본음 (레)
          [1174, 0.25], // 한 옥타브 위를 살짝 섞어 따뜻하게
        ].forEach(([freq, level]) => {
          const osc = tickCtx.createOscillator();
          const g = tickCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, t);
          g.gain.value = level;
          osc.connect(g);
          g.connect(gain);
          osc.start(t);
          osc.stop(t + 0.47);
        });
      }

      function countdownTick() {
        if (!running || endTime === null) return;

        const secondsLeft = Math.ceil((endTime - Date.now()) / 1000);

        if (secondsLeft < 1 || secondsLeft > COUNTDOWN_SECONDS) return;
        if (secondsLeft === lastTickSecond) return;

        lastTickSecond = secondsLeft;
        playTick();
      }

      function stopHiddenTicker() {
        if (hiddenWorker) {
          hiddenWorker.terminate();
          hiddenWorker = null;
        }
        if (hiddenWorkerUrl) {
          URL.revokeObjectURL(hiddenWorkerUrl);
          hiddenWorkerUrl = null;
        }
      }

      function stopTimers() {
        stopHiddenTicker();
        cancelAnimationFrame(timerId);
        cancelAnimationFrame(titleRafId);
        clearTimeout(titleTimeoutId);

        timerId = null;
        titleRafId = null;
        titleTimeoutId = null;
      }

      function pauseForSettings() {
        if (!running) return;

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (phase === "focus") {
          commitCurrentFocusTime();
        }

        running = false;

        stopTimers();

        endTime = null;

        render();
      }

      function openSettings() {
        if (settingsOpen) return;

        settingsWasRunning = running;

        pauseForSettings();

        settingsOpen = true;

        focusInput.value = settings.focusMinutes;

        breakInput.value = settings.breakMinutes;

        timerContent.classList.add("is-settings");

        settingsContent.classList.add("open");

        settingsContent.setAttribute("aria-hidden", "false");
      }

      function closeSettings() {
        settingsOpen = false;

        timerContent.classList.remove("is-settings");

        settingsContent.classList.remove("open");

        settingsContent.setAttribute("aria-hidden", "true");
      }

      function validateSettings() {
        const focusMinutes = Number(focusInput.value);

        const breakMinutes = Number(breakInput.value);

        if (
          !Number.isInteger(focusMinutes) ||
          focusMinutes < 1 ||
          focusMinutes > 180
        ) {
          showToast("집중 시간은 1~180분으로 입력해주세요.");
          return false;
        }

        if (
          !Number.isInteger(breakMinutes) ||
          breakMinutes < 1 ||
          breakMinutes > 60
        ) {
          showToast("휴식 시간은 1~60분으로 입력해주세요.");
          return false;
        }

        return true;
      }

      function saveSettings() {
        if (!validateSettings()) {
          return false;
        }

        const focusMinutes = Number(focusInput.value);

        const breakMinutes = Number(breakInput.value);

        settings = {
          focusMinutes,
          breakMinutes,
        };

        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {
          console.warn("설정 저장 실패:", e);
        }

        const wasRunning = settingsWasRunning;

        const currentPhase = phase;

        /*
        설정 저장 시 현재 집중 구간을
        먼저 한 번만 확정한다.
      */
        if (phase === "focus" && focusSegmentStartRemaining !== null) {
          commitCurrentFocusTime();
        }

        running = false;
        stopTimers();
        endTime = null;

        settingsWasRunning = false;

        phase = currentPhase;

        // 설정 변경 전까지 이미 지난 시간
        const elapsed = Math.max(0, duration - remaining);

        duration =
          phase === "focus"
            ? settings.focusMinutes * 60
            : settings.breakMinutes * 60;

        // 지난 시간은 유지하고, 새 설정 기준으로 남은 시간 계산 (최소 1초)
        remaining = Math.max(1, duration - elapsed);

        focusSegmentStartRemaining = null;

        setBackgroundForPhase();

        render();

        closeSettings();

        showToast(
          `설정 저장 완료 · 집중 ${focusMinutes}분 / 휴식 ${breakMinutes}분`,
        );

        if (wasRunning) {
          start({ silent: true });
        }

        return true;
      }

      function cancelSettings() {
        focusInput.value = settings.focusMinutes;

        breakInput.value = settings.breakMinutes;

        const shouldResume = settingsWasRunning;

        settingsWasRunning = false;

        closeSettings();

        render();

        if (shouldResume) {
          start();
        }

        showToast("설정 변경 취소");
      }

      timeEl.addEventListener("click", (event) => {
        event.stopPropagation();

        if (!settingsOpen) {
          openSettings();
        }
      });

      timeEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();

          if (!settingsOpen) {
            openSettings();
          }
        }
      });

      saveSettingsBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        saveSettings();
      });

      cancelSettingsBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        cancelSettings();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && finishPopupOpen) {
          closeFinishPopup();
          return;
        }

        if (event.key === "Escape" && settingsOpen) {
          cancelSettings();
        }
      });

      finishOkBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        closeFinishPopup();
      });

      finishOverlay.addEventListener("click", (event) => {
        // 팝업 바깥(어두운 영역)을 누르면 닫는다.
        if (event.target === finishOverlay) {
          closeFinishPopup();
        }
      });

      [focusInput, breakInput].forEach((input) => {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            saveSettings();
          }
        });
      });

      settingsContent.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      function start({ silent = false } = {}) {
        if (running) return;
        if (settingsOpen) return;

        running = true;

        /*
        현재 focus 구간의 시작점을
        remaining 기준으로 기록한다.
      */
        if (phase === "focus" && focusSegmentStartRemaining === null) {
          focusSegmentStartRemaining = remaining;
        }

        endTime = Date.now() + remaining * 1000;

        unlockTickAudio();
        lastTickSecond = Math.ceil(remaining);

        beep(phase === "focus" ? "focusStart" : "breakStart");

        if (!silent) {
          showToast(phase === "focus" ? "집중 시작 🍅" : "휴식 시작 ☕");
        }

        render();

        timerId = requestAnimationFrame(tick);

        startTitleTimer();
      }

      function tick() {
        if (!running) return;

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (remaining <= 0) {
          remaining = 0;

          render();

          transition();

          return;
        }

        countdownTick();

        render();

        if (!running) return;

        timerId = requestAnimationFrame(tick);
      }

      function pause() {
        if (!running) return;

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (phase === "focus") {
          commitCurrentFocusTime();
        }

        running = false;

        stopTimers();

        endTime = null;

        beep("pause");

        render();

        showToast("일시정지");
      }

      function transition() {
        /*
        자동 종료 / 다음 단계 버튼 모두
        여기로 들어온다.

        focus라면 먼저 현재 focus 시간을
        한 번만 확정한다.
      */
        if (running && endTime !== null) {
          remaining = Math.max(0, (endTime - Date.now()) / 1000);
        }

        if (phase === "focus") {
          commitCurrentFocusTime();
        }

        running = false;

        stopTimers();

        endTime = null;

        if (phase === "focus") {
          beep("focusEnd");

          phase = "break";

          duration = settings.breakMinutes * 60;

          remaining = duration;

          focusSegmentStartRemaining = null;

          setBackgroundForPhase();

          showToast(`집중 끝! ${settings.breakMinutes}분 휴식 🌿`);
        } else {
          beep("breakEnd");

          phase = "focus";

          duration = settings.focusMinutes * 60;

          remaining = duration;

          focusSegmentStartRemaining = null;

          setBackgroundForPhase();

          showToast("휴식 끝! 다시 집중 🍅");
        }

        render();

        start();
      }

      function skip() {
        if (settingsOpen) return;
        transition();
      }

      function openFinishPopup(seconds) {
        finishPopupOpen = true;

        finishText.textContent = `🥳 오늘 ${formatHMS(seconds)} 집중했어요!`;

        finishOverlay.classList.add("open");
        finishOverlay.setAttribute("aria-hidden", "false");

        finishOkBtn.focus();
      }

      function closeFinishPopup() {
        if (!finishPopupOpen) return;

        finishPopupOpen = false;

        finishOverlay.classList.remove("open");
        finishOverlay.setAttribute("aria-hidden", "true");

        // 이제 화면 합계를 새 값(자정 이후 몫)으로 맞춘다.
        render();
      }

      /*
        종료: 정지 + 집중 처음으로 + 날짜 경계 적용
        자정을 넘겼으면 팝업으로 하루 합계를 먼저 보여준다.
      */
      function finishSession() {
        if (settingsOpen || finishPopupOpen) return;

        beep("pause");

        if (running && endTime !== null) {
          remaining = Math.max(0, (endTime - Date.now()) / 1000);
        }

        if (running && phase === "focus") {
          commitCurrentFocusTime();
        }

        running = false;
        stopTimers();
        endTime = null;

        focusSegmentStartRemaining = null;

        phase = "focus";
        duration = settings.focusMinutes * 60;
        remaining = duration;

        setBackgroundForPhase();

        const crossedMidnight = focusTotalDate !== getLocalDateKey();
        const summarySeconds = totalFocusSeconds;

        if (crossedMidnight && summarySeconds > 0) {
          // 날짜 정리는 지금 저장하고, 팝업이 떠 있는 동안에는
          // 화면 합계를 그대로 둔다. (닫을 때 새 값으로 갱신)
          applyDayBoundary();
          openFinishPopup(summarySeconds);
          render();
          return;
        }

        applyDayBoundary();
        saveFocusTotal();
        render();
        showToast("종료");
      }

      function updateTabTitle() {
        if (!running || endTime === null) {
          return;
        }

        const currentRemaining = Math.max(0, (endTime - Date.now()) / 1000);

        document.title =
          `${format(currentRemaining)} · ` +
          `${phase === "focus" ? "집중" : "휴식"}`;
      }

      /*
        탭이 숨겨졌을 때(다른 탭을 보고 있을 때)는 브라우저가
        setTimeout을 1초 단위로 몰아서 실행해서 2초씩 건너뛰기도 한다.
        Web Worker의 타이머는 이 제한을 받지 않으므로 0.2초마다
        깨워서 남은 시간을 다시 계산한다. (endTime 기준이라 정확함)
      */
      function hiddenTick() {
        if (!running || endTime === null) {
          stopHiddenTicker();
          return;
        }

        if (endTime - Date.now() <= 0) {
          remaining = 0;
          render();
          transition();
          return;
        }

        countdownTick();
        updateTabTitle();
      }

      function startHiddenTicker() {
        try {
          const blob = new Blob(
            ["setInterval(function(){postMessage(0)},200)"],
            { type: "text/javascript" },
          );
          hiddenWorkerUrl = URL.createObjectURL(blob);
          hiddenWorker = new Worker(hiddenWorkerUrl);
          hiddenWorker.onmessage = hiddenTick;
          return;
        } catch (error) {
          stopHiddenTicker();
        }

        // Worker를 못 쓰는 환경용 대체 경로
        const fallback = () => {
          titleTimeoutId = null;
          hiddenTick();
          if (running && endTime !== null && titleTimeoutId === null) {
            titleTimeoutId = setTimeout(fallback, 250);
          }
        };
        titleTimeoutId = setTimeout(fallback, 250);
      }

      function startTitleTimer() {
        cancelAnimationFrame(titleRafId);
        clearTimeout(titleTimeoutId);
        stopHiddenTicker();

        titleRafId = null;
        titleTimeoutId = null;

        updateTabTitle();

        const titleTick = () => {
          if (!running || endTime === null) {
            return;
          }

          updateTabTitle();

          if (document.visibilityState === "visible" && running) {
            titleRafId = requestAnimationFrame(titleTick);
          }
        };

        if (document.visibilityState === "visible") {
          titleRafId = requestAnimationFrame(titleTick);
        } else {
          startHiddenTicker();
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          if (running && endTime !== null) {
            remaining = Math.max(0, (endTime - Date.now()) / 1000);
          }
          saveFocusTotal(true);
        } else {
          rolloverIfIdle();
        }

        if (!running) return;

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (remaining <= 0) {
          remaining = 0;
          render();
          transition();
          return;
        }

        render();
        startTitleTimer();
      });

      /*
      페이지가 잠시 백그라운드로 갔다가
      돌아오는 경우에도 타이머는 endTime을
      기준으로 계속 정확하게 계산한다.
    */
      window.addEventListener("pageshow", () => {
        rolloverIfIdle();

        if (!running || endTime === null) {
          return;
        }

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (remaining <= 0) {
          remaining = 0;
          render();
          transition();
          return;
        }

        render();
        startTitleTimer();
      });

      window.addEventListener("pagehide", () => {
        if (running && endTime !== null) {
          remaining = Math.max(0, (endTime - Date.now()) / 1000);
        }
        saveFocusTotal(true);
      });

      document.getElementById("start").addEventListener("click", () => {
        rolloverIfIdle();
        start();
      });

      document.getElementById("pause").addEventListener("click", pause);

      document.getElementById("skip").addEventListener("click", skip);

      document.getElementById("finish").addEventListener("click", finishSession);

      render();
    </script>
  </body>
</html>
